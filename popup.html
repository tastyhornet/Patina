<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark">🕰️</span>
        <div>
          <h1>Patina</h1>
          <p class="tag">Hall of Neglect</p>
        </div>
      </div>
      <label class="power" title="Enable / disable aging">
        <input type="checkbox" id="enabled" />
        <span class="knob"></span>
      </label>
    </header>

    <section class="controls">
      <div class="ctl">
        <label for="threshold">Decay begins after</label>
        <select id="threshold">
          <option value="5000">5 seconds (test)</option>
          <option value="15000">15 seconds (test)</option>
          <option value="60000">1 minute (demo)</option>
          <option value="900000">15 minutes</option>
          <option value="3600000">1 hour</option>
          <option value="21600000">6 hours</option>
          <option value="86400000">1 day</option>
          <option value="604800000">1 week</option>
        </select>
      </div>
      <div class="ctl">
        <label for="intensity">Intensity <span id="intensityVal">100%</span></label>
        <input type="range" id="intensity" min="0.5" max="1.5" step="0.1" value="1" />
      </div>
      <label class="check">
        <input type="checkbox" id="stripdecay" />
        <span>Age the favicon &amp; title too</span>
      </label>
    </section>

    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing neglected yet. Admirable.</p>

    <footer>Older tabs sink to the top. Click one to revisit &amp; restore it.</footer>
    <script src="popup.js"></script>
  </body>
</html>
